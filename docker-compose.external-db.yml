name: remote-sync

x-runtime-image: &runtime-image
  image: ${REMOTE_SYNC_IMAGE:-remote-sync:local}
  build:
    context: .
    dockerfile: Dockerfile

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-server-environment: &server-environment
  DATABASE_URL: ${DATABASE_URL:?Set an external PostgreSQL DATABASE_URL}
  BLOB_ROOT: /var/lib/remote-sync/blobs
  LISTEN_ADDR: :8443
  SYNC_DEVICE_ID: ${SYNC_DEVICE_ID:-}
  SYNC_DEVICE_TOKEN: ${SYNC_DEVICE_TOKEN:-}
  ALLOW_INSECURE: ${ALLOW_INSECURE:-true}
  DEV_BOOTSTRAP: ${DEV_BOOTSTRAP:-true}
  SYNC_USER_ID: ${SYNC_USER_ID:-}
  SYNC_FOLDER_ID: ${SYNC_FOLDER_ID:-}
  TLS_CERT_FILE: ${TLS_CERT_FILE:-}
  TLS_KEY_FILE: ${TLS_KEY_FILE:-}
  MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10737418240}
  MAX_FOLDER_LIVE_SIZE_BYTES: ${MAX_FOLDER_LIVE_SIZE_BYTES:-1099511627776}
  MAX_USER_LIVE_SIZE_BYTES: ${MAX_USER_LIVE_SIZE_BYTES:-1099511627776}
  MAX_PENDING_UPLOAD_SIZE_BYTES: ${MAX_PENDING_UPLOAD_SIZE_BYTES:-21474836480}
  MAX_CHUNK_SIZE_BYTES: ${MAX_CHUNK_SIZE_BYTES:-1048576}
  GC_ENABLED: ${GC_ENABLED:-true}
  GC_INTERVAL: ${GC_INTERVAL:-1h}
  GC_BATCH_SIZE: ${GC_BATCH_SIZE:-100}

services:
  migrate:
    <<:
      - *runtime-image
      - *runtime-security
    restart: "no"
    entrypoint:
      - /usr/local/bin/sync-migrate
    command:
      - -dir
      - /app/migrations
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set an external PostgreSQL DATABASE_URL}

  server:
    <<:
      - *runtime-image
      - *runtime-security
    restart: unless-stopped
    environment:
      <<: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${REMOTE_SYNC_BIND_ADDRESS:-127.0.0.1}:${REMOTE_SYNC_PORT:-8443}:8443"
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 8443
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
    volumes:
      - remote-sync-blobs:/var/lib/remote-sync/blobs

volumes:
  remote-sync-blobs:
