services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: remote_sync
      POSTGRES_USER: remote_sync
      POSTGRES_PASSWORD: remote_sync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_sync -d remote_sync"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - remote-sync-postgres:/var/lib/postgresql

volumes:
  remote-sync-postgres:
