name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: remote_sync
          POSTGRES_USER: remote_sync
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remote_sync -d remote_sync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://remote_sync:test-only-password@127.0.0.1:5432/remote_sync?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -p 1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...
      - name: Validate container setup
        run: |
          sh -n scripts/init-env.sh scripts/docker-compose.sh
          test_directory="$(mktemp -d)"
          trap 'rm -rf "$test_directory"' EXIT

          ./scripts/init-env.sh \
            --database bundled \
            --output "$test_directory/bundled.env"
          REMOTE_SYNC_ENV_FILE="$test_directory/bundled.env" \
            ./scripts/docker-compose.sh config --quiet

          DATABASE_URL='postgres://remote_sync:test-only-password@db.example.invalid:5432/remote_sync?sslmode=require' \
            ./scripts/init-env.sh \
            --database external \
            --output "$test_directory/external.env"
          REMOTE_SYNC_ENV_FILE="$test_directory/external.env" \
            ./scripts/docker-compose.sh config --quiet

          docker build --tag remote-sync:test .
