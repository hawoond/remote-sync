name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
          - windows
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ./scripts/package-release.sh \
            "${GITHUB_REF_NAME}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            dist
      - name: Upload package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum remote-sync_* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Remote Sync ${GITHUB_REF_NAME}" \
            --notes "Download the archive for your operating system and CPU, then open QUICKSTART_KO.txt or QUICKSTART_EN.txt. The binaries are not code-signed; verify SHA256SUMS.txt before running them."
